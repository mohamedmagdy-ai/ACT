name: Build Android APK (لوحة متابعة المحل)

on:
  push:
    paths:
      - 'mobile-android/**'
    branches:
      - master
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        working-directory: mobile-android
        run: npm install

      - name: Sync Capacitor Android assets
        working-directory: mobile-android
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x mobile-android/android/gradlew

      - name: Build debug APK
        working-directory: mobile-android/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ACT-Mobile-Dashboard-debug-apk
          path: mobile-android/android/app/build/outputs/apk/debug/app-debug.apk
