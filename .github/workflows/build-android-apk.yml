name: Build Android APK (لوحة متابعة المحل)

on:
  push:
    paths:
      - 'mobile-android/**'
    branches:
      - master
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub Actions ملحوظة مهمة: الـ secrets context متاحش مباشرة جوه أي "if:" (قيد معروف
    # وموثّق من GitHub نفسه — راجع actions/runner#520). الحل: نحوّله لمتغيّر env على
    # مستوى الـ job (ده مسموح فيه secrets عادي)، وبعدين نستخدم env.HAS_UPDATES_TOKEN
    # جوه الـ if بدل ما نستخدم secrets.UPDATES_REPO_TOKEN مباشرة.
    env:
      HAS_UPDATES_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        working-directory: mobile-android
        run: npm install

      - name: Sync Capacitor Android assets
        working-directory: mobile-android
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x mobile-android/android/gradlew

      - name: Build debug APK
        working-directory: mobile-android/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK (build artifact, for manual download)
        uses: actions/upload-artifact@v4
        with:
          name: ACT-Mobile-Dashboard-debug-apk
          path: mobile-android/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Read app version
        id: appver
        run: echo "version=$(cat mobile-android/www/version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Publish update release (public updates repo)
        if: ${{ env.HAS_UPDATES_TOKEN == 'true' && vars.UPDATES_REPO != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.UPDATES_REPO }}
          token: ${{ secrets.UPDATES_REPO_TOKEN }}
          tag_name: v${{ steps.appver.outputs.version }}
          name: v${{ steps.appver.outputs.version }}
          make_latest: true
          files: mobile-android/android/app/build/outputs/apk/debug/app-debug.apk
